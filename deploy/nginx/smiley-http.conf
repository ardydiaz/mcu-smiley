# Installed to /etc/nginx/conf.d/smiley-http.conf (http-level settings for the Smiley site).

# Do not log query strings or referrers: SSO callbacks (?token=...) and Teams
# digest download links carry bearer tokens in the URL. $uri would show the SPA's
# internal /index.html rewrite, so log the original path with the query string cut off.
map $request_uri $smiley_log_path {
    "~^(?<path>[^?]*)" $path;
}
log_format smiley_safe '$remote_addr [$time_local] "$request_method $smiley_log_path $server_protocol" '
                       '$status $body_bytes_sent rt=$request_time cf_ray=$http_cf_ray "$http_user_agent"';

# Keyed on the real client IP (restored from CF-Connecting-IP in cloudflare-realip.conf).
limit_req_zone  $binary_remote_addr zone=smiley_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=smiley_conn:10m;

upstream smiley_api {
    server 127.0.0.1:4100;
    keepalive 16;
}
