# Installed to /etc/nginx/sites-available/smiley.conf (symlinked into sites-enabled).
# Only port 443 is served; Cloudflare's "Always Use HTTPS" handles http:// at the edge.

# Refuse TLS for any hostname other than ours (e.g. scanners hitting the bare IP).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name smiley.mcu.edu.ph;
    # Set per server: Ubuntu 26.04's nginx.conf already sets server_tokens at http level.
    server_tokens off;

    # Temporary self-signed cert from bootstrap; replace with a Cloudflare Origin CA cert.
    ssl_certificate     /etc/ssl/smiley/origin.pem;
    ssl_certificate_key /etc/ssl/smiley/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SmileySSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Authenticated Origin Pulls: enable these two lines only AFTER turning on
    # Authenticated Origin Pulls in Cloudflare, or every request will fail with 400.
    # ssl_client_certificate /etc/ssl/smiley/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    access_log /var/log/nginx/smiley.access.log smiley_safe;
    error_log  /var/log/nginx/smiley.error.log warn;

    client_max_body_size 64k;
    root /var/www/smiley;
    index index.html;

    # API docs are not public; reach them via an SSH tunnel to 127.0.0.1:4100.
    location ^~ /api/docs { return 404; }
    # Admins are created with deploy/scripts/create-admin.sh; never via HTTP.
    location = /api/auth/register { return 404; }

    location /api/ {
        limit_req zone=smiley_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://smiley_api;
        include /etc/nginx/snippets/smiley-proxy.conf;
        proxy_read_timeout 60s;
    }

    # Server-Sent Events for the kiosk setup page: long-lived, must not be buffered.
    location = /api/kiosk/terminals/events {
        limit_conn smiley_conn 50;
        proxy_pass http://smiley_api;
        include /etc/nginx/snippets/smiley-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/smiley-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html, which must never be cached.
    location / {
        include /etc/nginx/snippets/smiley-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
