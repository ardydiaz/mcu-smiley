# Installed to /etc/nginx/snippets/smiley-proxy.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# $remote_addr is the real client (restored from CF-Connecting-IP). Overwrite rather than
# append so a client-supplied X-Forwarded-For cannot spoof the IP Express sees.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
